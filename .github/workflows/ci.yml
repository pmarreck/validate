name: CI

on:
  push:
  pull_request:

jobs:
  build-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install ffmpeg for PATH tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-linux-musl-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-linux-musl-
      - name: Build (linux musl x86_64)
        env:
          VALIDATE_NIX: "1"
          DEBUG: "0"
          VALIDATE_DEBUG: "1"
        run: ./build -Dtarget=x86_64-linux-musl
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: validate-linux-x86_64-musl
          path: zig-out/bin/validate
          if-no-files-found: error

  build-macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/Library/Caches/zig
          key: zig-macos-aarch64-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-macos-aarch64-
      - name: Build (macOS aarch64)
        env:
          VALIDATE_NIX: "1"
          DEBUG: "0"
        run: ./build -Dtarget=aarch64-macos
      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: validate-macos-aarch64
          path: zig-out/bin/validate
          if-no-files-found: error

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install ffmpeg for PATH tests
        run: choco install ffmpeg -y
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/AppData/Local/zig
          key: zig-windows-x86_64-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-windows-x86_64-
      - name: Build (windows x86_64)
        env:
          VALIDATE_NIX: "1"
          DEBUG: "0"
        shell: bash
        run: ./build -Dtarget=x86_64-windows
      - name: Run Windows path validation tests
        shell: cmd
        run: tests\cli\windows_path_validation.bat
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: validate-windows-x86_64
          path: zig-out/bin/validate.exe
          if-no-files-found: error
